# Screenshots of the system pages. Paths in "out" are relative to docs/nago.dev.
# Run: cd docs/screenshots && go run . -f shots/systems.yaml
#
# Admin pages are captured with the bootstrap admin (admin: true, login step). Shots of one example run in
# the same tab, so only the first one needs the login step.
defaults:
  width: 1200
  height: 700
  scale: 2
  crop: viewport
  quality: 85

shots:
  # tutorial-26 enables the standard systems and user circles
  - example: tutorial-26-buildin-iam
    out: content/docs/systems/session_management/login.webp
    path: /account/login
    admin: true
  - example: tutorial-26-buildin-iam
    out: content/docs/systems/admin_management/admin-center.webp
    height: 800
    steps:
      - login: true
      - goto: /admin
      - wait: 800ms
  - example: tutorial-26-buildin-iam
    out: content/docs/systems/user_management/users.webp
    steps:
      - goto: /admin/accounts
      - wait: 800ms
  - example: tutorial-26-buildin-iam
    out: content/docs/systems/group_management/groups.webp
    steps:
      - goto: /admin/groups
      - wait: 800ms
  - example: tutorial-26-buildin-iam
    out: content/docs/systems/permission_management/permissions.webp
    steps:
      - goto: /admin/permissions
      - wait: 800ms
  - example: tutorial-26-buildin-iam
    out: content/docs/systems/secret_management/vault.webp
    steps:
      - goto: /admin/secret/vault
      - wait: 800ms
      - clickText: Secret hinzufügen
      - wait: 800ms
  - example: tutorial-26-buildin-iam
    out: content/docs/systems/template_management/projects.webp
    height: 600
    steps:
      - goto: /admin/template/projects
      - wait: 800ms
  - example: tutorial-26-buildin-iam
