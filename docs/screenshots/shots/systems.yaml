  - example: tutorial-26-buildin-iam
    out: content/docs/systems/user_circle_management/circles.webp
    steps:
      - goto: /admin/user/circles
      - wait: 800ms
      - clickText: Eintrag hinzufügen
      - wait: 800ms

  - example: tutorial-26-buildin-iam
    out: content/docs/systems/settings_management/user-settings.webp
    height: 800
    steps:
      - goto: /admin
      - wait: 800ms
      - type: { selector: "input", text: "Allgemeine Vorgaben" }
      - wait: 800ms
