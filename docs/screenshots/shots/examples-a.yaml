# Screenshots of the example pages for the tutorials 01-59. Paths in "out" are relative to docs/nago.dev.
# Run: cd docs/screenshots && go run . -f shots/examples-a.yaml [-only tutorial-11-buttons]
#
# Without a screenshot, because they show no meaningful UI or do not start:
#   tutorial-23-appear-disappear, tutorial-24-redraw, tutorial-25-blobstore (a single line of text),
#   tutorial-43-clipboard (a single button), tutorial-22-custom-handler (the SVG is shown clipped),
#   tutorial-59-cms (the CMS editor is empty), tutorial-40-images (access denied without a custom role),
#   tutorial-41-absolute, tutorial-42-service, tutorial-50-settings (panic at startup, the hard-coded
#   bootstrap admin password is rejected as too weak), tutorial-56-rest (the OpenAPI page is not a Nago page).
defaults:
  width: 1200
  height: 800
  scale: 2
  crop: auto
  padding: 24
  quality: 90

shots:
  - example: tutorial-01-helloworld
    out: content/docs/examples/tutorial-01-helloworld/screenshot.webp
  - example: tutorial-02-combining-views
    out: content/docs/examples/tutorial-02-combining-views/screenshot.webp
