# Screenshots of the example pages for the tutorials 60 and above. Paths in "out" are relative to docs/nago.dev.
# Run: cd docs/screenshots && go run . -f shots/examples-b.yaml [-only tutorial-60-customfont]
defaults:
  width: 1200
  height: 800
  scale: 2
  crop: auto
  padding: 24
  quality: 90

