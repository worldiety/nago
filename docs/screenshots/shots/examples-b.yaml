  - example: tutorial-93-canvas
    out: content/docs/examples/tutorial-93-canvas/screenshot.webp
    steps:
      - wait: 1s
      # the canvas only draws on pointer events, the image loads with the first one
      - js: &pointer "(() => { const c = document.querySelector('canvas'); const r = c.getBoundingClientRect(); for (const t of ['pointerdown', 'pointermove', 'pointermove', 'pointerup']) c.dispatchEvent(new PointerEvent(t, {bubbles: true, pointerId: 1, isPrimary: true, clientX: r.left + 180, clientY: r.top + 140})) })()"
      - wait: 1s
      - js: *pointer
      - wait: 1s

  - example: tutorial-94-canvas-editor
    out: content/docs/examples/tutorial-94-canvas-editor/screenshot.webp
    steps:
      - wait: 1s
      - js: *pointer
      - wait: 1s
      - js: *pointer
      - wait: 1s

