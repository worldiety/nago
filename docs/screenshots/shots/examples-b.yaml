      - goto: /admin/settings/global?type=2f503f6894af16bc3aadd0ed454fe86ff1d6bf6a459ae5ae3e0607b4
      - wait: 1s
      - js: "[...document.querySelectorAll('*')].filter(e => e.children.length === 0 && e.textContent.includes('Sign On')).pop()?.scrollIntoView({block: 'center'})"
      - wait: 500ms

