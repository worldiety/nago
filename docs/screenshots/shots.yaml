# All screenshots of nago.dev. Paths in "out" are relative to docs/nago.dev.
# Run: cd docs/screenshots && go run . [-only tutorial-11-buttons]
defaults:
  width: 1200
  height: 800
  scale: 2
  crop: auto
  padding: 24
  quality: 90

shots:
  - example: tutorial-11-buttons
    out: content/docs/examples/tutorial-11-buttons/screenshot.webp
