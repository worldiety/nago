name: Build & Deploy nago.dev

on:
  push:
    branches: [ main ]
    paths: [ 'docs/nago.dev/**', 'docs/serve.go', 'example/**', '.github/workflows/docs.yml' ]
  pull_request:
    paths: [ 'docs/nago.dev/**', 'docs/serve.go', 'example/**', '.github/workflows/docs.yml' ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build site with Hugo
        run: |
          cd docs/nago.dev
          hugo build --minify

      - name: Build hugo-go-binary
        run: |
          cd docs
          # the nested module would hide nago.dev/public from go:embed
          rm nago.dev/go.mod
          GOOS=linux GOARCH=amd64 go build serve.go

      - name: Upload site via curl
        if: github.event_name != 'pull_request'
        run: |
          set -e
          curl -sS --fail-with-body -X POST https://nago.app/api/v1/application/build \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F "file=@docs/serve" \
            -F "info={\"app\":\"aa06698613a0895fc8293c15208db041\", \"version\":{\"major\":0, \"minor\":0, \"patch\":0}, \"vcs\":{\"commit\":\"$GITHUB_SHA\", \"branch\":\"$GITHUB_REF_NAME\", \"tag\":\"$GITHUB_REF_NAME\"}};type=application/json"
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
